name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Clés publiques Supabase (anon) — nécessaires au build Vite / GitHub Pages
      VITE_SUPABASE_URL: https://esrcyqkjdoafglxwdqml.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzcmN5cWtqZG9hZmdseHdkcW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NzE0NzgsImV4cCI6MjA5MjU0NzQ3OH0.nJ6frjxC-Qhmq-a3m2jvKEQF-6hPnwXlEGVybe3oZmo
      VITE_BASE_PATH: /SwapSmart/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
