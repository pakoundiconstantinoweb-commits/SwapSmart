name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://esrcyqkjdoafglxwdqml.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzcmN5cWtqZG9hZmdseHdkcW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NzE0NzgsImV4cCI6MjA5MjU0NzQ3OH0.nJ6frjxC-Qhmq-a3m2jvKEQF-6hPnwXlEGVybe3oZmo
      VITE_BASE_PATH: /SwapSmart/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
